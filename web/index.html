<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Personas</title>
  <link rel="stylesheet" href="/styles.css" />
  <script>
    // Applied before first paint so a dark-theme reload never flashes white.
    (function () {
      var saved = localStorage.getItem("pepper.theme");
      var dark = saved ? saved === "dark"
        : window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    })();
  </script>
</head>
<body>
  <header>
    <div class="brand">
      <b id="home">Personas</b>
      <span id="crumb"></span>
    </div>
    <div class="right">
      <button class="btn icon ghost" id="theme" title="Toggle theme">◐</button>
    </div>
  </header>
  <main id="app"></main>
  <script type="module" src="/app.js"></script>
</body>
</html>
