# Staging copy of the persona console.
#
# Same image and same shape as production, deliberately: a staging app that
# differs in configuration tests the configuration rather than the change. The
# only differences are the ones that have to differ - the app name and its
# volume, so a test upload can never appear in a demo.
#
#   npm run deploy:staging
#
app = "pepper-persona-poc-staging"
primary_region = "sin"

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # Staging is idle almost all the time, so it suspends between visits and
  # costs nothing while nobody is looking at it.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[mounts]
  source = "persona_data_staging"
  destination = "/app/examples"

# Matches production. Transcription and the voice pass are the memory-hungry
# steps, and finding that out on staging is the entire point of having one.
[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
