# Persona console. Single machine: personas live on disk under examples/, so
# there is nothing to shard and no second instance that could see stale state.
app = "pepper-persona-poc"
primary_region = "sin"

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[mounts]
  source = "persona_data"
  destination = "/app/examples"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
